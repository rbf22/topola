[package]
name = "topola-cli"
description = "Work-in-progress free and open-source topological (rubberband) router and autorouter for printed circuit boards (PCBs)"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "topola"
path = "src/main.rs"

[features]
default = []
metrics = ["topola/metrics"]

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies.topola]
path = "../.."
default-features = false

[dependencies.clap]
version = "4.5"
features = ["derive"]

