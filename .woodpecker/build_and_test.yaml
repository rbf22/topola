matrix:
  include:
    - CHANNEL: stable
      PROFILE: release
    - CHANNEL: stable
      PROFILE: dev
    - CHANNEL: nightly
      PROFILE: dev

steps:
  build_cli:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    commands:
      - rustup default "$CHANNEL"
      - cargo build -j4 --profile "$PROFILE" -p topola-cli --
    when:
      event: [pull_request, push, tag]

  # Testing is a step instead of a separate flow to reduce Codeberg's CI usage.
  test:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    commands:
      - apt-get -y install curl
      - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - cargo binstall --no-confirm cargo-nextest
      - rustup default "$CHANNEL"
      - cargo nextest run -j4 --cargo-profile "$PROFILE" --hide-progress-bar --success-output final
    when:
      event: [pull_request, push, tag]
      # Only run tests for stable channel to avoid straining Codeberg's CI.
      evaluate: 'CHANNEL == "stable"'


